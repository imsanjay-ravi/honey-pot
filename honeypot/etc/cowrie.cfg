# ==============================================================================
# Cowrie Configuration for AI Adaptive Cyber Deception Lab
# ==============================================================================
# File Location on Ubuntu: /home/sanjay/cowrie/etc/cowrie.cfg
#
# This file overrides default settings in cowrie.cfg.dist.
# ==============================================================================

[honeypot]
# Hostname visible to attackers
hostname = corp-srv-db01

# Authentication backend class: UserDB reads etc/userdb.txt
auth_class = UserDB

# Directory where userdb.txt is located (relative to cowrie installation directory)
etc_path = etc

# Disable passwordless/blank authentication bypass
auth_none_enabled = false

[ssh]
# Enable SSH honeypot service
enabled = true

# Listening port for honeypot (redirected from 22 or directly 2222)
listen_endpoints = tcp:2222:interface=0.0.0.0

# Version banner string presented to connecting SSH clients
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4

[output_jsonlog]
# JSONL log output consumed by telemetry/collector.py
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false
